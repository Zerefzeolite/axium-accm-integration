              # The transfer is the existing hard-capped subprocess pipe, not a host mount.
              assert 0<len(raw)<=16*1024*1024
              begin=b"ACCM_RESOLVER_LOCK_FRAME_BEGIN"
              end=b"ACCM_RESOLVER_LOCK_FRAME_END"
              lines=raw.split(b"\n")
              assert lines.count(begin)==1 and lines.count(end)==1
              i,j=lines.index(begin),lines.index(end)
              assert j==i+2 and j==len(lines)-2 and lines[-1]==b""
              encoded=lines[i+1]
              limit=512*1024
              assert 0<len(encoded)<=4*((limit+2)//3)
              data=base64.b64decode(encoded,validate=True)
              assert 0<len(data)<=limit and base64.b64encode(data)==encoded
