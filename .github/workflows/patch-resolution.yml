name: ACCM dependency patch resolution
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: accm-public-source-qualification
  cancel-in-progress: false
jobs:
  resolve:
    if: github.repository == 'Zerefzeolite/axium-accm-integration' && github.repository_id == '1472823260' && github.actor_id == '9297681' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && github.run_number == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Resolve fixed public dependency versions without compiling
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(id -u)" -ne 0
          test "$(uname -m)" = x86_64
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_WORKFLOW_REF" = 'Zerefzeolite/axium-accm-integration/.github/workflows/patch-resolution.yml@refs/heads/main'
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          root="$(mktemp -d)"
          tag="accm-patch-resolver:$GITHUB_RUN_ID"
          release_name="accm-resolve-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test_name="accm-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            docker rm -f "$release_name" "$test_name" >/dev/null 2>&1 || true
            docker image rm "$tag" >/dev/null 2>&1 || true
            rm -rf -- "$root"
          }
          trap cleanup EXIT
          mkdir -m 700 "$root/home" "$root/gnupg" "$root/tmp" "$root/context" "$root/tool" "$root/vendor" "$root/src" "$root/work" "$root/review" "$root/registry"
          cd "$root"
          clean() { env -i PATH=/usr/bin:/bin HOME="$root/home" TMPDIR="$root/tmp" LC_ALL=C TZ=UTC "$@"; }
          fetch() {
            clean /usr/bin/curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 20 --max-time 600 --output "$2" "$1"
          }
          fetch https://static.rust-lang.org/rust-key.gpg.ascii rust-key.asc
          fetch https://static.rust-lang.org/dist/channel-rust-1.98.0.toml manifest.toml
          fetch https://static.rust-lang.org/dist/channel-rust-1.98.0.toml.asc manifest.asc
          clean /usr/bin/gpg --homedir "$root/gnupg" --batch --import rust-key.asc
          clean /usr/bin/gpg --homedir "$root/gnupg" --batch --with-colons --list-keys > key.txt
          clean /usr/bin/gpg --homedir "$root/gnupg" --batch --status-fd 1 --verify manifest.asc manifest.toml > signature.txt
          clean /usr/bin/python3 - <<'PY'
          import pathlib, re, tomllib, urllib.parse
          p = pathlib.Path
          expected = "108F66205EAEB0AAA8DD5E1C85AB96E6FA1BE5FE"
          rows = [x.split(":") for x in p("key.txt").read_text().splitlines()]
          primary = [rows[i+1][9] for i, x in enumerate(rows) if x[0] == "pub" and rows[i+1][0] == "fpr"]
          assert primary == [expected], "Unexpected signing key"
          sigs = [x.split() for x in p("signature.txt").read_text().splitlines() if x.startswith("[GNUPG:] VALIDSIG ")]
          assert len(sigs) == 1 and sigs[0][-1] == expected, "Wrong signer"
          assert sigs[0][9] in {"8", "9", "10", "11"}, "Weak signature hash"
          m = tomllib.loads(p("manifest.toml").read_text())
          assert m["pkg"]["rust"]["version"].split()[0] == "1.98.0"
          a = m["pkg"]["rust"]["target"]["x86_64-unknown-linux-gnu"]
          assert a["available"] is True
          u = urllib.parse.urlsplit(a["xz_url"])
          assert u.scheme == "https" and u.netloc == "static.rust-lang.org"
          assert re.fullmatch(r"/dist/(?:[0-9]{4}-[0-9]{2}-[0-9]{2}/)?rust-1\.98\.0-x86_64-unknown-linux-gnu\.tar\.xz", u.path)
          assert not u.query and not u.fragment
          assert re.fullmatch(r"[0-9a-f]{64}", a["xz_hash"])
          p("archive-url.txt").write_text(a["xz_url"])
          p("archive.sha256").write_text(a["xz_hash"] + "  rust.tar.xz\n")
          PY
          fetch "$(cat archive-url.txt)" rust.tar.xz
          clean /usr/bin/sha256sum -c archive.sha256
          # The signed manifest cryptographically binds the standalone archive.
          clean /usr/bin/tar -xJf rust.tar.xz
          test -f rust-1.98.0-x86_64-unknown-linux-gnu/install.sh
          image='docker.io/library/ubuntu@sha256:9a04f13b3f80ef056361e30868593b1cfd2279fe19e4081cb93a90bf56819d6a'
          docker pull --platform linux/amd64 "$image"
          test "$(docker image inspect "$image" --format '{{.Id}}')" = sha256:2b147973fd863c93ced60f325461fe0e262b91317b008e6a2d961f13e81af0e4
          # Public CA bundle for HTTPS bootstrap; apt still authenticates signed
          # Ubuntu metadata and verifies all archive hashes. No host home/context.
          install -m 0644 /etc/ssl/certs/ca-certificates.crt context/bootstrap-ca.crt
          cat > context/Dockerfile <<'DOCKERFILE'
          FROM docker.io/library/ubuntu@sha256:9a04f13b3f80ef056361e30868593b1cfd2279fe19e4081cb93a90bf56819d6a
          COPY --chmod=0644 bootstrap-ca.crt /opt/bootstrap-ca.crt
          RUN set -eux; \
              test "$(stat -c %a /opt/bootstrap-ca.crt)" = 644; \
              runuser -u _apt -- test -r /opt/bootstrap-ca.crt; \
              runuser -u _apt -- grep -q '^-----BEGIN CERTIFICATE-----$' /opt/bootstrap-ca.crt; \
              mkdir -p /opt/accm-inventory; \
              rm -f /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt.conf.d/docker-clean; \
              printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20261125T000000Z/ noble main universe' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20261125T000000Z/ noble-updates main universe' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://snapshot.ubuntu.com/ubuntu/20261125T000000Z/ noble-security main universe' > /etc/apt/sources.list; \
              apt-get -o Acquire::https::CaInfo=/opt/bootstrap-ca.crt -o APT::Update::Error-Mode=any update; \
              sha256sum /var/lib/apt/lists/*InRelease | LC_ALL=C sort > /opt/accm-inventory/apt-release.sha256; \
              DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::https::CaInfo=/opt/bootstrap-ca.crt -y --no-install-recommends --download-only install build-essential pkg-config libssl-dev libsqlite3-dev ca-certificates python3 git perl; \
              (cd /var/cache/apt/archives && sha256sum *.deb | LC_ALL=C sort) > /opt/accm-inventory/deb.sha256; \
              DEBIAN_FRONTEND=noninteractive apt-get -y --no-install-recommends --no-download install build-essential pkg-config libssl-dev libsqlite3-dev ca-certificates python3 git perl; \
              dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' | LC_ALL=C sort > /opt/accm-inventory/packages.tsv; \
              sha256sum /usr/bin/gcc /usr/bin/g++ /usr/bin/ld /usr/bin/ar /usr/bin/pkg-config /usr/bin/python3 > /opt/accm-inventory/tools.sha256; \
              chmod -R a+rX /opt/accm-inventory; \
              rm -f /opt/bootstrap-ca.crt; apt-get clean; rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          # Package installation happens only in an ephemeral image build,
          # before any Rust source/vendor inputs are mounted.
          docker build --platform linux/amd64 --no-cache --pull=false --tag "$tag" "$root/context"
          builder="$(docker image inspect "$tag" --format '{{.Id}}')"
          test "$(docker image inspect "$tag" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          echo "BUILDER_IMAGE_ID=$builder"
          uid="$(id -u)"
          gid="$(id -g)"
          hostnet="$(readlink /proc/self/ns/net)"
          common=(--rm --pull never --platform linux/amd64 --read-only --cap-drop ALL --security-opt no-new-privileges:true --user "$uid:$gid" --pids-limit 512 --memory 8g --cpus 2 --tmpfs "/tmp:rw,nosuid,nodev,size=512m,mode=1777" --env LC_ALL=C --env TZ=UTC)
          offline=(--network none --env "EXPECTED_UID=$uid" --env "HOST_NETNS=$hostnet")
          # Same boundary as successful container preflight; install verified
          # Rust into a disposable directory, then mount it read-only.
          docker run "${common[@]}" "${offline[@]}" \
            --mount "type=bind,source=$root/rust-1.98.0-x86_64-unknown-linux-gnu,target=/input,readonly" \
            --mount "type=bind,source=$root/tool,target=/toolchain" \
            --env HOME=/tmp --workdir /tmp --entrypoint /bin/bash "$builder" --noprofile --norc -euc '
              test "$(id -u)" = "$EXPECTED_UID"
              test "$(readlink /proc/self/ns/net)" != "$HOST_NETNS"
              test "$(ls -1 /sys/class/net)" = lo
              grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              /bin/bash /input/install.sh --prefix=/toolchain --disable-ldconfig
              /toolchain/bin/rustc --version --verbose
              /toolchain/bin/cargo --version
            '
          printf '%s\n' '3690cc576ede140504698405d5d8fa3826aaadbe71699c6c4ed0a565d6f493e2  tool/bin/rustc' 'ff3022fcbd13b08434ea7afde9a0ef9d5b3f5c17b5fc7a40031be3ee000a6a24  tool/bin/cargo' | sha256sum -c -
          # Fetch the exact public upstream commit; no upstream CI is run.
          commit=1238aae8fc64b212641190a9227c8a734ab1a793
          tree=ba5c80c1ba7d268cb91e34b153f161646737d9ec
          gitclean() { clean /usr/bin/env GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 /usr/bin/git -c core.hooksPath=/dev/null "$@"; }
          gitclean init -q "$root/upstream"
          gitclean -C "$root/upstream" fetch --no-tags --depth=1 https://github.com/bitwarden/sm-action.git "$commit"
          test "$(gitclean -C "$root/upstream" rev-parse FETCH_HEAD)" = "$commit"
          test "$(gitclean -C "$root/upstream" rev-parse 'FETCH_HEAD^{tree}')" = "$tree"
          gitclean -C "$root/upstream" archive "$commit" Cargo.toml Cargo.lock LICENSE src | tar -xf - -C "$root/src"
          while read -r pin path; do
            test "$(gitclean hash-object --no-filters "$root/src/$path")" = "$pin"
          done <<'PINS'
          570832c893c2eafe6a918329c5510b5810245902 Cargo.toml
          279d24b39d2978eb3ab5944e6e56f2a8db8428a7 Cargo.lock
          2ca8921c939df8b53902a93aae162b06562c5ee7 src/main.rs
          eed4ce7a14f4249be82189f1b2f1df4c6d6e271d src/config.rs
          08e184384973134e68bad14fe8d1d4ec4af25f72 src/ci.rs
          e72bfddabc15be5718a7cc061ac10e47741d8219 LICENSE
          PINS
          test "$(find "$root/src" -type f | wc -l)" -eq 6
          cat > "$root/capture.py" <<'CAPTURE_PY'
          import os, pathlib, stat, struct, hashlib, subprocess, sys, tempfile
          
          LIMIT = 16 * 1024 * 1024
          PREVIEW = 512 * 1024
          
          def encode(data):
              # Escape every delimiter byte, percent, control and non-ASCII byte.
              return "".join(chr(b) if 32 <= b < 127 and b not in (35, 37, 58)
                             else "%%%02X" % b for b in data)
          
          def capture(argv, path, limit, cancel):
              total = 0
              with open(path, "xb") as out:
                  p = subprocess.Popen(argv, stdout=subprocess.PIPE,
                                       stderr=subprocess.STDOUT, bufsize=0)
                  try:
                      while True:
                          data = p.stdout.read(65536)
                          if not data:
                              break
                          if len(data) > limit - total:
                              cancel()
                              return 125
                          out.write(data)
                          total += len(data)
                      return p.wait()
                  finally:
                      if p.poll() is None:
                          p.kill()
                      p.wait()
                      p.stdout.close()
          
          def replay(path):
              size = path.stat().st_size
              assert size <= LIMIT
              with path.open("rb") as f:
                  first = f.read(PREVIEW)
                  if size > 2 * PREVIEW:
                      f.seek(-PREVIEW, os.SEEK_END)
                      tail = f.read(PREVIEW)
                      parts = [first, tail]
                  else:
                      parts = [first + f.read(PREVIEW)]
              print("ACCM_CAPTURE_BYTES=" + str(size))
              for idx, part in enumerate(parts):
                  if idx:
                      print("ACCM_CAPTURE_MIDDLE_OMITTED")
                  for line in part.split(b"\n"):
                      for offset in range(0, max(1, len(line)), 4096):
                          safe = encode(line[offset:offset + 4096])
                          assert "::" not in safe and "##[" not in safe
                          print("BUILD | " + safe)
          
          def selftest():
              payload = bytes(range(256)) + b"::::::##[::" + b"x" * 20000
              safe = encode(payload)
              assert "::" not in safe and "##[" not in safe
              assert "\r" not in safe and "\n" not in safe
              from urllib.parse import unquote_to_bytes
              assert unquote_to_bytes(safe) == payload
              with tempfile.TemporaryDirectory() as tmp:
                  root = pathlib.Path(tmp)
                  p = root / "ok"
                  assert capture([sys.executable, "-c", "import sys; sys.stdout.buffer.write(b'ok\\n')"], p, 64, lambda: None) == 0
                  assert p.read_bytes() == b"ok\n"
                  p = root / "overflow"
                  cancelled = []
                  assert capture([sys.executable, "-c", "import sys; sys.stdout.buffer.write(b'x'*8192)"],
                                 p, 1024, lambda: cancelled.append(True)) == 125
                  assert cancelled == [True] and p.stat().st_size <= 1024
                  p = root / "replay"
                  p.write_bytes(payload + b"\n" + b":::##[::\r\x1b")
                  from contextlib import redirect_stdout
                  from io import StringIO
                  out = StringIO()
                  with redirect_stdout(out):
                      replay(p)
                  lines = out.getvalue().splitlines()
                  assert lines[0].startswith("ACCM_CAPTURE_BYTES=")
                  assert all(line.startswith("BUILD | ") for line in lines[1:])
                  assert all("::" not in line and "##[" not in line for line in lines)
                  assert all(len(line) <= 8 + 4096 * 3 for line in lines[1:])
                  p = root / "failure"
                  assert capture([sys.executable, "-c", "import sys; sys.exit(7)"],
                                 p, 64, lambda: None) == 7
              print("ACCM_CAPTURE_SELFTEST_PASS")
          
          def seal(source, target):
              # Container has stopped. Only a regular, single-link bounded ELF may cross.
              fd = os.open(source, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as f:
                  s = os.fstat(f.fileno())
                  assert stat.S_ISREG(s.st_mode) and s.st_nlink == 1
                  assert 64 <= s.st_size <= 64 * 1024 * 1024
                  data = f.read(64 * 1024 * 1024 + 1)
                  assert len(data) == s.st_size
              assert data[:6] == b"\x7fELF\x02\x01" and struct.unpack_from("<H", data, 18)[0] == 62
              with open(target, "xb") as f:
                  f.write(data)
              os.chmod(target, 0o555)
              print("CANDIDATE_BYTES=" + str(len(data)))
              print("CANDIDATE_SHA256=" + hashlib.sha256(data).hexdigest())
          
          if __name__ == "__main__":
              if sys.argv[1:] == ["--selftest"]:
                  selftest()
              elif sys.argv[1] == "--seal":
                  seal(sys.argv[2], sys.argv[3])
              else:
                  path, name = pathlib.Path(sys.argv[1]), sys.argv[2]
                  def cancel():
                      try:
                          subprocess.run(["/usr/bin/docker", "rm", "-f", name],
                                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                                         timeout=15, check=False)
                      except (OSError, subprocess.TimeoutExpired):
                          pass
                  result = capture(sys.argv[3:], path, LIMIT, cancel)
                  replay(path)
                  if result == 125:
                      print("ACCM_CAPTURE_OVERFLOW_OR_EXIT125")
                  sys.exit(result if 0 <= result <= 255 else 1)
          CAPTURE_PY
          clean /usr/bin/python3 "$root/capture.py" --selftest
          mkdir -m 700 "$root/patch"
          cp -a "$root/src/." "$root/patch/"
          # Resolver only: Cargo update does not run build scripts or compile crates.
          # Preserve the original source and use a dedicated writable candidate copy.
          clean /usr/bin/python3 "$root/capture.py" "$root/resolve.log" "$release_name" /usr/bin/docker run "${common[@]}" --name "$release_name" --log-driver none --network bridge \
            --mount "type=bind,source=$root/tool,target=/toolchain,readonly" \
            --mount "type=bind,source=$root/patch,target=/patch" \
            --mount "type=bind,source=$root/registry,target=/cargo-home" \
            --env HOME=/tmp --env CARGO_HOME=/cargo-home --env RUSTC=/toolchain/bin/rustc \
            --env CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse --env CARGO_NET_RETRY=1 --env CARGO_HTTP_TIMEOUT=30 \
            --env PATH=/toolchain/bin:/usr/bin:/bin \
            --workdir /patch --entrypoint /bin/bash "$builder" --noprofile --norc -euc '
              set -o pipefail
              test "$(id -u)" -ne 0
              grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status
              grep -Eq "^CapBnd:[[:space:]]+0+$" /proc/self/status
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              grep -Eq "^Seccomp:[[:space:]]+2$" /proc/self/status
              test ! -S /var/run/docker.sock
              cargo update -p rustls --precise 0.23.46
              cargo update -p rustls-webpki --precise 0.103.16
              cargo update -p h2 --precise 0.4.16
              cargo update -p url --precise 2.5.9
              cargo update -p crypto-bigint --precise 0.7.6
              cargo update -p ctutils --precise 0.4.4
              cargo update -p crossbeam-epoch --precise 0.9.20
              cargo metadata --locked --format-version 1 --no-deps > /tmp/metadata.json
            '
          # No executable crosses the container boundary. Only bounded lock metadata.
          clean /usr/bin/python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, stat, tomllib
          from pathlib import Path
          def read_regular(p, limit):
              fd = os.open(p, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as f:
                  s = os.fstat(f.fileno())
                  assert stat.S_ISREG(s.st_mode) and s.st_nlink == 1 and s.st_size <= limit
                  data = f.read(limit + 1)
                  assert len(data) == s.st_size
                  return data
          for name in ("Cargo.toml", "LICENSE", "src/main.rs", "src/config.rs", "src/ci.rs"):
              assert read_regular("patch/" + name, 1024*1024) == Path("src/" + name).read_bytes(), "Non-lock source changed"
          old = Path("src/Cargo.lock").read_bytes()
          new = read_regular("patch/Cargo.lock", 512*1024)
          assert hashlib.sha256(old).hexdigest() == "cf301ce7de2e66b03cfbe7174b7a91e058f367a3c0bdf5cf5a4bbb52ba92445a"
          def parse(data):
              pkgs = tomllib.loads(data.decode())["package"]
              result = {}
              for p in pkgs:
                  key = (p["name"], p["version"])
                  assert re.fullmatch(r"[A-Za-z0-9_-]{1,128}", key[0])
                  assert re.fullmatch(r"[0-9][A-Za-z0-9.+-]{0,95}", key[1])
                  assert key not in result
                  if p["name"] == "sm-action":
                      assert p["version"] == "3.0.1" and "source" not in p
                  else:
                      assert p["source"] == "registry+https://github.com/rust-lang/crates.io-index"
                      assert re.fullmatch(r"[a-f0-9]{64}", p["checksum"])
                  result[key] = p
              return result
          before, after = parse(old), parse(new)
          targets = {"rustls":"0.23.46","rustls-webpki":"0.103.16","h2":"0.4.16","url":"2.5.9","crypto-bigint":"0.7.6","ctutils":"0.4.4","crossbeam-epoch":"0.9.20"}
          for name, ver in targets.items():
              assert {v for n,v in after if n == name} == {ver}, "Exact patch target missing"
          # SDK package versions and registry checksums must not change.
          def sdk(pkgs):
              return {k: v.get("checksum") for k,v in pkgs.items() if k[0] == "bitwarden" or k[0].startswith("bitwarden-")}
          assert sdk(before) == sdk(after)
          for key in before.keys() & after.keys():
              assert before[key].get("checksum") == after[key].get("checksum")
          removed = sorted(before.keys() - after.keys())
          added = sorted(after.keys() - before.keys())
          assert len(removed) + len(added) <= 80, "Unexpected broad resolver change"
          print("ACCM_PATCH_OLD_PACKAGE_COUNT=" + str(len(before)))
          print("ACCM_PATCH_NEW_PACKAGE_COUNT=" + str(len(after)))
          for n,v in removed:
              print("LOCK_REMOVED " + n + " " + v)
          for n,v in added:
              print("LOCK_ADDED " + n + " " + v)
          print("ACCM_PATCH_LOCK_SHA256=" + hashlib.sha256(new).hexdigest())
          print("ACCM_PATCH_LOCK_BASE64_BEGIN")
          encoded = base64.b64encode(new).decode("ascii")
          for i in range(0, len(encoded), 4096):
              print(encoded[i:i+4096])
          print("ACCM_PATCH_LOCK_BASE64_END")
          print("ACCM_PATCH_RESOLUTION_PASS_NOT_ADMITTED")
          PY
