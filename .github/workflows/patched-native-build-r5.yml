                  fd=os.open("resolve.log",os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK,dir_fd=rootfd)
                  with os.fdopen(fd,"rb") as f:
                      s=os.fstat(f.fileno())
                      assert stat.S_ISREG(s.st_mode) and s.st_nlink==1 and 0<s.st_size<=16*1024*1024
                      raw=f.read(16*1024*1024+1)
                      assert len(raw)==s.st_size
                      return decode_lock_frame(raw)
